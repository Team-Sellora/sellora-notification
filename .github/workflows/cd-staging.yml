name: CD - Deploy Staging

on:
  push:
    branches:
      - dev

permissions:
  contents: read

concurrency:
  group: cd-staging-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy-staging:
    name: Deploy to Azure staging
    runs-on: ubuntu-latest
    environment: staging

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          IMAGE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          IMAGE="${DOCKERHUB_USERNAME}/sellora-notification"

          docker build \
            -t "${IMAGE}:${IMAGE_SHA}" \
            -t "${IMAGE}:staging" \
            .

          docker push "${IMAGE}:${IMAGE_SHA}"
          docker push "${IMAGE}:staging"

      - name: Wait for Azure to pull and deploy new image
        run: |
          echo "Waiting 60s for Azure Deployment Center to pull the new :staging image..."
          sleep 60

      - name: Validate deployed app startup
        shell: bash
        env:
          BASE_URL: ${{ secrets.STAGING_BASE_URL }}
        run: |
          set -euo pipefail

          HEALTH_URL="${BASE_URL}/health"
          WHOAMI_URL="${BASE_URL}/whoami"

          for attempt in {1..20}; do
            HEALTH_STATUS=$(curl \
              --silent \
              --location \
              --output /dev/null \
              --write-out "%{http_code}" \
              "$HEALTH_URL" || true)

            if [ "$HEALTH_STATUS" = "200" ]; then
              echo "Startup validation passed: /health=200"
              exit 0
            fi

            echo "Attempt $attempt -> /health=${HEALTH_STATUS}"
            sleep 15
          done

          echo "Deployment validation failed: app did not start with expected runtime configuration"
          exit 1