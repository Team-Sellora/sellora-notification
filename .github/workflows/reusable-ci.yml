name: Reusable .NET CI

on:
  workflow_call:
    inputs:
      solution-path:
        required: true
        type: string
      sonar-project-key:
        required: true
        type: string
      sonar-organization:
        required: true
        type: string
    secrets:
      SONAR_TOKEN:
        required: true

jobs:
  build-test-analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: notification_ci
          POSTGRES_USER: sellora_ci
          POSTGRES_PASSWORD: sellora_ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sellora_ci -d notification_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      kafka:
        image: apache/kafka:3.9.2
        ports:
          - 9092:9092
        env:
          KAFKA_NODE_ID: 1
          KAFKA_PROCESS_ROLES: broker,controller
          KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
          KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
          KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
          KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
          KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
          KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
          KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
          KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
          KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
          KAFKA_NUM_PARTITIONS: 3
        options: >-
          --health-cmd "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092"
          --health-interval 10s
          --health-timeout 10s
          --health-retries 12
          --health-start-period 15s

    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      TZ: UTC

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.403

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: zulu

      - name: Cache SonarQube Cloud packages
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Cache SonarQube Cloud scanner
        id: cache-sonar-scanner
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/scanner
          key: ${{ runner.os }}-sonar-scanner
          restore-keys: ${{ runner.os }}-sonar-scanner

      - name: Install SonarScanner
        if: steps.cache-sonar-scanner.outputs.cache-hit != 'true'
        run: |
          mkdir -p ${{ runner.temp }}/scanner
          dotnet tool update dotnet-sonarscanner \
            --tool-path "${{ runner.temp }}/scanner"

      - name: Restore dependencies
        run: dotnet restore "${{ inputs.solution-path }}"

      - name: SonarQube begin
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          "${{ runner.temp }}/scanner/dotnet-sonarscanner" begin \
            /k:"${{ inputs.sonar-project-key }}" \
            /o:"${{ inputs.sonar-organization }}" \
            /d:sonar.token="$SONAR_TOKEN" \
            /d:sonar.cs.opencover.reportsPaths="**/coverage.opencover.xml"

      - name: Build solution
        run: |
          dotnet build "${{ inputs.solution-path }}" \
            --configuration Release \
            --no-restore

      - name: Wait for Kafka broker
        run: |
          CONTAINER_ID="${{ job.services.kafka.id }}"
          for attempt in $(seq 1 60); do
            if docker exec "${CONTAINER_ID}" \
                /opt/kafka/bin/kafka-broker-api-versions.sh \
                --bootstrap-server localhost:9092 >/dev/null 2>&1; then
              echo "Kafka broker is ready"
              exit 0
            fi
            echo "Waiting for Kafka broker (${attempt}/60)..."
            sleep 2
          done
          echo "Kafka broker did not become ready in time"
          docker logs "${CONTAINER_ID}" || true
          exit 1

      - name: Run tests with coverage
        run: |
          dotnet test "${{ inputs.solution-path }}" \
            --configuration Release \
            --no-build \
            --collect:"XPlat Code Coverage" \
            --results-directory ./TestResults \
            --logger "trx;LogFileName=test-results.trx"

      - name: SonarQube end
        if: always()
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          "${{ runner.temp }}/scanner/dotnet-sonarscanner" end \
            /d:sonar.token="$SONAR_TOKEN"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: ./TestResults

      - name: Build Docker image
        run: |
          OWNER_LC=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          IMAGE_TAG="ghcr.io/${OWNER_LC}/sellora-notification:${{ github.sha }}"
          docker build -t "$IMAGE_TAG" -t "sellora-notification:ci" .
          echo "IMAGE_TAG=$IMAGE_TAG" >> $GITHUB_ENV

      - name: Verify health with unreachable dependencies
        run: |
          set -euo pipefail

          docker run -d --name sellora-notification-ci \
            --network host \
            -e ASPNETCORE_ENVIRONMENT=Container \
            -e ASPNETCORE_URLS="http://+:8099" \
            -e ConnectionStrings__Default="Host=localhost;Port=5432;Database=notification_ci;Username=sellora_ci;Password=sellora_ci_password" \
            -e Jwt__Authority="https://auth.invalid" \
            -e Jwt__MetadataAddress="https://auth.invalid/.well-known/openid-configuration" \
            -e Jwt__Issuer="https://auth.invalid" \
            -e Jwt__Audience__0="ci-audience" \
            -e Kafka__BootstrapServers="localhost:9092" \
            -e Smtp__Host="localhost" \
            -e Smtp__Port="1025" \
            sellora-notification:ci

          echo "Waiting for container to start..."
          STATUS="000"
          for i in $(seq 1 15); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8099/health || echo "000")
            if [ "$STATUS" = "200" ]; then
              echo "Health check passed: /health returned 200"
              break
            fi
            echo "  Attempt $i: status=$STATUS — retrying in 2s"
            sleep 2
          done

          if [ "$STATUS" != "200" ]; then
            echo "Health check did not return 200 after 30s"
            docker logs sellora-notification-ci
            exit 1
          fi

      - name: Cleanup health-check container
        if: always()
        run: docker rm -f sellora-notification-ci || true
